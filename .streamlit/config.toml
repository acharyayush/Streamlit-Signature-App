# Streamlit configuration for local runs and Streamlit Community Cloud.
# Reference: https://docs.streamlit.io/develop/api-reference/configuration/config.toml

[theme]
primaryColor = "#2E86DE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
# Signature images are small; 10 MB per upload is plenty and keeps memory bounded.
maxUploadSize = 10

[browser]
gatherUsageStats = false
